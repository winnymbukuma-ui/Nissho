<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nissho & Madame Nissho — Faire-part de mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--cream:#FAF8F5;--gold:#C5A059;--ink:#2C2C2C;--sage:#8FA58F;--line:#E7DFD0;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font:300 15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;line-height:1.15}
.sec{max-width:720px;margin:0 auto;padding:76px 22px;text-align:center}
.sec h2{font-size:clamp(32px,7vw,44px);margin-bottom:14px}
.rule{width:56px;height:1px;background:var(--gold);margin:18px auto 26px}
.btn{display:inline-block;border:1px solid var(--gold);background:var(--gold);color:#fff;font:500 13px var(--sans);letter-spacing:.06em;padding:14px 28px;border-radius:2px;cursor:pointer;text-decoration:none;transition:background .25s,color .25s,transform .2s}
.btn:hover{background:#b48d47}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--gold)}.btn.ghost:hover{background:var(--gold);color:#fff}
.btn.sm{padding:8px 14px;font-size:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}

/* ---------- Enveloppe (toucher le sceau pour ouvrir) ---------- */
.env{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 28%,#FFFDF9,var(--cream) 60%,#EFE8DA);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;transition:opacity .9s .2s,visibility 0s 1.1s}
.env.gone{opacity:0;visibility:hidden}
.env .names{font-size:clamp(30px,8vw,44px)}
.stage{position:relative;width:min(86vw,400px);aspect-ratio:4/5;perspective:1100px;filter:drop-shadow(0 14px 26px rgba(80,60,20,.18))}
.stage>*{position:absolute;inset:0}
.e-back{background:#E6DAC4;border-radius:4px;z-index:0}
.e-card{inset:6% 6% auto;height:88%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;z-index:2;transition:transform 1.1s .6s}
.e-card small{font-size:12px;color:#777}
.e-card b{font:500 28px var(--serif)}
.e-card span{font:italic 400 40px var(--serif);color:var(--gold);margin-top:10px}
.e-front{background:#F1E8D8;clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);z-index:3;border-radius:4px}
.e-flap{background:#E0D2B7;clip-path:polygon(0 0,100% 0,50% 52%);transform-origin:top;z-index:4;transition:transform .9s,z-index 0s .45s;border-radius:4px}
.seal{inset:auto;left:50%;top:52%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;z-index:5;background:radial-gradient(circle at 35% 30%,#E8CC8C,#C5A059 55%,#9c7a38);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;transition:opacity .4s}
.seal em{font:italic 500 26px var(--serif)}
.seal::after{content:"";position:absolute;inset:-6px;border:1px solid var(--gold);border-radius:50%;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.tap{font-size:13px;color:#6b6b6b;letter-spacing:.03em;transition:opacity .4s}
.env.open .e-flap{transform:rotateX(180deg);z-index:1}
.env.open .e-card{transform:translateY(-72%)}
.env.open .seal,.env.open .tap{opacity:0;pointer-events:none}
/* ---------- Accueil ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 22px;background:linear-gradient(180deg,var(--cream),#F3EEE4)}
.hero .hello{max-width:520px;font:italic 400 clamp(20px,5vw,26px)/1.45 var(--serif);margin-bottom:26px}
.hero .names{font-size:clamp(44px,12vw,84px);color:var(--ink)}
.hero .names i{display:block;font-size:.5em;color:var(--gold);margin:4px 0}
.hero .date{margin:26px 0 22px;font-size:14px;letter-spacing:.08em}
.cd{display:flex;gap:10px;justify-content:center}
.cd div{min-width:66px;padding:12px 6px;border:1px solid var(--line);background:#fff}
.cd b{display:block;font:500 30px var(--serif);color:var(--gold)}
.cd small{font-size:11px;color:#777}
.seats{margin-top:22px;font-size:13px;color:#6b6b6b}
.msg p{font:400 clamp(19px,4.6vw,23px)/1.7 var(--serif);max-width:560px;margin:0 auto}
.count{background:#EFF3EE;border-top:1px solid #DCE5DB;border-bottom:1px solid #DCE5DB}
.count p{font:400 clamp(20px,5vw,26px)/1.5 var(--serif)}
.count b{color:var(--gold);font-size:1.5em}

/* ---------- Programme ---------- */
.tl{list-style:none;padding:0;margin:34px 0 0;text-align:left;border-left:1px solid var(--gold)}
.tl li{position:relative;padding:0 0 38px 26px}
.tl li::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.tl time{font-size:13px;color:var(--gold);font-weight:500}
.tl h3{font-size:28px;margin:2px 0}
.tl p{color:#6b6b6b;margin-bottom:10px;font-size:14px}

/* ---------- Galerie ---------- */
.gal{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:130px;gap:8px;margin-top:30px}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.gal div{overflow:hidden}.gal div:hover img{transform:scale(1.05)}
.gal .tall{grid-row:span 2}.gal .wide{grid-column:span 2}
@media(min-width:640px){.gal{grid-auto-rows:190px}}

/* ---------- RSVP ---------- */
.choices{display:grid;gap:12px;margin:26px 0 18px}
@media(min-width:560px){.choices{grid-template-columns:1fr 1fr}}
.choice{padding:16px;border:1px solid var(--line);background:#fff;font:400 14px var(--sans);cursor:pointer;transition:all .25s;border-radius:2px}
.choice:hover{border-color:var(--gold)}
.choice.on{background:var(--gold);border-color:var(--gold);color:#fff}
.choice.on.no{background:var(--ink);border-color:var(--ink)}
textarea,input{width:100%;padding:13px;border:1px solid var(--line);background:#fff;font:300 15px var(--sans);border-radius:2px;color:var(--ink)}
textarea{min-height:96px;resize:vertical;margin-bottom:18px}
.thanks{font:italic 400 24px/1.5 var(--serif);margin:24px 0 12px}
.err{color:#a14040;font-size:13px;margin-top:10px}
footer{padding:46px 22px 110px;text-align:center;font:italic 400 22px var(--serif);color:var(--gold)}

/* ---------- Lecteur ---------- */
.player{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;max-width:min(92vw,360px);padding:9px 18px 9px 14px;border:1px solid var(--line);border-radius:40px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.1);cursor:pointer;font:400 11px/1.35 var(--sans);color:var(--ink);text-align:left}
.bars{display:flex;gap:3px;align-items:center;height:18px;flex:none}
.bars i{width:3px;height:6px;background:var(--gold);border-radius:2px}
.player.on .bars i{animation:wave 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s!important}.bars i:nth-child(3){animation-delay:.4s!important}.bars i:nth-child(4){animation-delay:.6s!important}
@keyframes wave{0%,100%{height:5px}50%{height:18px}}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}.reveal{opacity:1;transform:none}}</style>
</head>
<body class="lock">
<div id="env" class="env" hidden>
  <p class="names serif">Nissho & Madame Nissho</p>
  <div class="stage">
    <div class="e-back"></div>
    <div class="e-card"><small>Invitation pour</small><b id="envFor"></b><span>N & N</span></div>
    <div class="e-front"></div>
    <div class="e-flap"></div>
    <button class="seal" id="seal" aria-label="Ouvrir l’invitation"><em>N&N</em></button>
  </div>
  <p class="tap">Touchez le sceau pour ouvrir l’invitation</p>
</div>
<main id="app"></main>
<button class="player" id="player" hidden aria-label="Lire ou mettre en pause la musique">
  <span class="bars"><i></i><i></i><i></i><i></i></span><span id="ptitle"></span>
</button>

<script>

  ],

  // ⑥ PHOTOS DU COUPLE — remplacez ces liens (ou chemins de fichiers, ex: 'photos/1.jpg').
  //    Classes : '' normal, 'tall' = haute, 'wide' = large.
  PHOTOS: [
    { src: 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27700%27%20height%3D%27900%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23E9DFCD%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23C5A059%27%20stop-opacity%3D%27.55%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27700%27%20height%3D%27900%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%27350%27%20y%3D%27470%27%20font-family%3D%27Georgia%27%20font-style%3D%27italic%27%20font-size%3D%2746%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EPhoto%201%3C/text%3E%3C/svg%3E', cls: 'tall' },
    { src: 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27700%27%20height%3D%27900%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23DCE5DB%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%238FA58F%27%20stop-opacity%3D%27.55%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27700%27%20height%3D%27900%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%27350%27%20y%3D%27470%27%20font-family%3D%27Georgia%27%20font-style%3D%27italic%27%20font-size%3D%2746%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EPhoto%202%3C/text%3E%3C/svg%3E', cls: '' },
    { src: 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27700%27%20height%3D%27900%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23F3E9D2%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23B48D47%27%20stop-opacity%3D%27.55%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27700%27%20height%3D%27900%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%27350%27%20y%3D%27470%27%20font-family%3D%27Georgia%27%20font-style%3D%27italic%27%20font-size%3D%2746%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EPhoto%203%3C/text%3E%3C/svg%3E', cls: '' },

    { src: 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27700%27%20height%3D%27900%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23E3EAE2%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%236f8a6f%27%20stop-opacity%3D%27.55%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27700%27%20height%3D%27900%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%27350%27%20y%3D%27470%27%20font-family%3D%27Georgia%27%20font-style%3D%27italic%27%20font-size%3D%2746%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EPhoto%205%3C/text%3E%3C/svg%3E', cls: 'tall' },
    { src: 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27700%27%20height%3D%27900%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23F1E8DA%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23C5A059%27%20stop-opacity%3D%27.55%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27700%27%20height%3D%27900%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%27350%27%20y%3D%27470%27%20font-family%3D%27Georgia%27%20font-style%3D%27italic%27%20font-size%3D%2746%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EPhoto%206%3C/text%3E%3C/svg%3E', cls: '' }
  ]
};
/* ======================= FIN DE LA CONFIGURATION ======================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasSB = !CONFIG.SUPABASE_URL.includes('VOTRE');
const sb = hasSB ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const siteUrl = () => CONFIG.SITE_URL || (location.origin + location.pathname.replace(/[^/]*$/, ''));
const link = t => `${siteUrl()}?invite=${t}`;

/* ---------- Accès aux données (Supabase ou mode démo) ---------- */
async function rpc(name, a = {}) {
  if (sb) { const { data, error } = await sb.rpc(name, a); if (error) throw error; return data; }
  const g = JSON.parse(localStorage.getItem('fp_demo') || '[]'), save = () => localStorage.setItem('fp_demo', JSON.stringify(g));
  const f = t => g.find(x => x.token === t);
  if (name.startsWith('admin_') && a.p_pin !== '1234') throw new Error('PIN');
  switch (name) {
    case 'get_invite': { const x = f(a.p_token); if (!x) return null; x.opened_at ||= new Date().toISOString(); save(); return { name: x.name, seats: x.seats, status: x.status, message: x.message }; }
    case 'rsvp': { const x = f(a.p_token); if (x) { x.status = a.p_status; x.message = a.p_message; save(); } return null; }
    case 'confirmed_count': return g.filter(x => x.status === 'present').reduce((s, x) => s + x.seats, 0);
    case 'admin_list': return g;
    case 'admin_add': g.unshift({ token: a.p_token, name: a.p_name, seats: a.p_seats, phone: a.p_phone, status: 'pending', created_at: new Date().toISOString() }); save(); return null;
    case 'admin_delete': g.splice(g.findIndex(x => x.token === a.p_token), 1); save(); return null;
  }
}

<script>
/* ---------- Démarrage / routage ---------- */
function boot() {
  const q = new URLSearchParams(location.search);
  const t = (q.get('invite') || '').trim();
  if (!t) return privateView();
  guestView(t);
}
function privateView() {
  document.body.classList.remove('lock');
  $('#app').innerHTML = `<section class="sec" style="min-height:100svh;display:flex;flex-direction:column;justify-content:center">
    <h2>Invitation privée</h2><div class="rule"></div>
    <p>Veuillez utiliser le lien personnel qui vous a été envoyé par WhatsApp.</p></section>`;
}

/* ---------- VUE INVITÉ ---------- */
let TOKEN, GUEST, AUDIO;
async function guestView(t) {
  TOKEN = t;
  try { GUEST = await rpc('get_invite', { p_token: t }); } catch (e) { GUEST = null; }
  if (!GUEST) return privateView();
  $('#envFor').textContent = GUEST.name;
  $('#env').hidden = false;
  renderGuest();
  const open = () => openInvite();
  $('#seal').onclick = open;
}

function openInvite() {
  if ($('#env').classList.contains('open')) return;
  AUDIO = new Audio(CONFIG.MUSIC_URL); AUDIO.loop = true; AUDIO.volume = .6;
  AUDIO.play().then(() => setPlayer(true)).catch(() => setPlayer(false)); // lancé par le clic = autorisé par le navigateur
  $('#ptitle').textContent = CONFIG.MUSIC_TITLE; $('#player').hidden = false;
  $('#env').classList.add('open');
  setTimeout(() => { $('#env').classList.add('gone'); document.body.classList.remove('lock'); }, 1900);
}
function setPlayer(on) { $('#player').classList.toggle('on', on); }
$('#player').onclick = () => { if (!AUDIO) return; if (AUDIO.paused) { AUDIO.play(); setPlayer(true); } else { AUDIO.pause(); setPlayer(false); } };

function renderGuest() {
  const mapBtn = a => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`;
  $('#app').innerHTML = `
  <header class="hero">
    <p class="hello">Cher(e) ${esc(GUEST.name)}, nous avons l’immense joie de vous convier à célébrer notre union.</p>
    <h1 class="names">Nissho <i>&</i> Madame Nissho</h1>
    <p class="date">${esc(CONFIG.WEDDING_DATE_LABEL)}</p>
    <div class="cd" id="cd"></div>
    <p class="seats">${GUEST.seats > 1 ? `${GUEST.seats} places vous sont réservées` : 'Une place vous est réservée'}</p>
  </header>

  <section class="sec msg reveal">
    <h2>Avec tout notre amour</h2><div class="rule"></div>
    <p>Notre histoire s’écrit à deux, et c’est entourés de ceux qui comptent le plus que nous voulons dire « oui ». Votre présence rendra ce jour inoubliable.</p>
  </section>

  <section class="sec reveal">
    <h2>Programme de la journée</h2><div class="rule"></div>
    <ul class="tl">${CONFIG.EVENTS.map(e => `<li><time>${esc(e.time)}</time><h3>${esc(e.title)}</h3><p>${esc(e.place)}</p>
      <a class="btn ghost sm" target="_blank" rel="noopener" href="${mapBtn(e.address)}">Ouvrir dans Google Maps</a></li>`).join('')}</ul>
  </section>

  <section class="sec reveal">
    <h2>Notre galerie</h2><div class="rule"></div>
    <div class="gal">${CONFIG.PHOTOS.map(p => `<div class="${p.cls}"><img src="${esc(p.src)}" alt="Nissho et Madame Nissho" loading="lazy"></div>`).join('')}</div>
  </section>

  <section class="count"><div class="sec reveal" style="padding:54px 22px"><p id="countTxt">&nbsp;</p></div></section>

  <section class="sec reveal" id="rsvp">
    <h2>Confirmez votre présence</h2><div class="rule"></div>
    <div id="rsvpBox"></div>
  </section>
  <footer>Nissho & Madame Nissho</footer>`;
  startCountdown(); renderRsvp(); refreshCount(); setInterval(refreshCount, 30000);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

function startCountdown() {
  const box = $('#cd'), target = new Date(CONFIG.WEDDING_DATE).getTime();
  const tick = () => {
    let d = target - Date.now();
    if (d <= 0) { box.innerHTML = '<p class="serif" style="font-size:26px">C’est le grand jour !</p>'; return; }
    const v = [Math.floor(d / 864e5), Math.floor(d % 864e5 / 36e5), Math.floor(d % 36e5 / 6e4), Math.floor(d % 6e4 / 1e3)];
    box.innerHTML = ['jours', 'heures', 'minutes', 'secondes'].map((l, i) => `<div><b>${v[i]}</b><small>${l}</small></div>`).join('');
  };
  tick(); setInterval(tick, 1000);
}

async function refreshCount() {
  try {
    const n = Number(await rpc('confirmed_count')) || 0;
    $('#countTxt').innerHTML = n === 0 ? 'Soyez parmi les premiers à confirmer votre présence à nos côtés.'
      : n === 1 ? 'Déjà <b>1</b> invité a confirmé sa présence à nos côtés.'
      : `Déjà <b>${n}</b> invités ont confirmé leur présence à nos côtés.`;
  } catch (e) {}
}

function renderRsvp(edit) {
  const box = $('#rsvpBox'), st = GUEST.status;
  if (st !== 'pending' && !edit) {
    box.innerHTML = `<p class="thanks">${st === 'present' ? 'Merci ! Nous avons hâte de vous retrouver.' : 'Merci de nous avoir prévenus. Vous nous manquerez.'}</p>
      <button class="btn ghost sm" id="chg">Modifier ma réponse</button>`;
    $('#chg').onclick = () => renderRsvp(true); return;
  }
  let choice = st === 'pending' ? null : st;
  box.innerHTML = `<div class="choices">
      <button class="choice" data-v="present">Oui, je serai présent(e)</button>
      <button class="choice no" data-v="absent">Non, je ne pourrai pas venir</button></div>
    <textarea id="wish" maxlength="500" placeholder="Un petit mot ou un vœu pour les mariés (facultatif)">${esc(GUEST.message || '')}</textarea>
    <button class="btn" id="send">Envoyer ma réponse</button><p class="err" id="rErr"></p>`;
  const mark = () => box.querySelectorAll('.choice').forEach(b => b.classList.toggle('on', b.dataset.v === choice));
  box.querySelectorAll('.choice').forEach(b => b.onclick = () => { choice = b.dataset.v; mark(); });
  mark();
  $('#send').onclick = async () => {
    if (!choice) { $('#rErr').textContent = 'Merci de choisir l’une des deux réponses.'; return; }
    try {
      const msg = $('#wish').value.trim();
      await rpc('rsvp', { p_token: TOKEN, p_status: choice, p_message: msg });
      GUEST.status = choice; GUEST.message = msg; renderRsvp(); refreshCount();
    } catch (e) { $('#rErr').textContent = 'Une erreur est survenue. Veuillez réessayer.'; }
  };
}
